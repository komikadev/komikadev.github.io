<style>
  :root { --bg:#0b1220; --card:#111a2e; --line:#263854; --green:#4ade80; --white:#f0f4f8; --dim:#94a3b8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--white);
    background-image:linear-gradient(#16213a 1px, transparent 1px), linear-gradient(90deg, #16213a 1px, transparent 1px);
    background-size:56px 56px;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:56px 20px 48px;
  }
  main { width:100%; max-width:560px; }
  .mono {
    width:76px; height:76px; background:var(--card); border:1.5px solid var(--line);
    color:var(--green); font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:30px; display:flex; align-items:center; justify-content:center;
    border-radius:18px; margin:0 auto 22px;
  }
  h1 { font-family:'JetBrains Mono',monospace; font-size:34px; text-align:center; }
  h1 span { color:var(--green); }
  .tag { text-align:center; color:var(--dim); font-size:16px; line-height:1.6; margin:12px auto 38px; max-width:440px; }
  a.card {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--card); border:1.5px solid var(--line); border-radius:16px;
    padding:18px 22px; margin-bottom:14px; text-decoration:none; color:var(--white);
    transition:border-color .18s ease, transform .18s ease;
  }
  a.card:hover, a.card:active { border-color:var(--green); transform:translateY(-1px); }
  .card .t { font-weight:700; font-size:17px; }
  .card .d { font-size:13.5px; color:var(--dim); margin-top:3px; line-height:1.45; }
  .card .arr { color:var(--green); font-size:20px; flex-shrink:0; }
  footer { text-align:center; color:var(--dim); font-size:13px; margin-top:40px; font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body>
<main>
  <div class="mono">k;</div>

    <span class="arr">→</span>
  </a>

  <footer>// deploy hari jumat? berani.</footer>
